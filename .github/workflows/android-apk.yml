name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Hosted app address, e.g. https://your-waiter.up.railway.app'
        required: true
      app_name:
        description: 'App name on the phone'
        default: 'AuraOS'
      app_id:
        description: 'Android app id (use a different one per app)'
        default: 'com.auraos.pos'
      apk_name:
        description: 'File name of the APK'
        default: 'AuraOS.apk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: client
        env:
          APP_URL: ${{ inputs.app_url }}
          APP_NAME: ${{ inputs.app_name }}
          APP_ID: ${{ inputs.app_id }}
          APK_NAME: ${{ inputs.apk_name }}
        run: bash android-wrapper/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.apk_name }}
          path: client/${{ inputs.apk_name }}
